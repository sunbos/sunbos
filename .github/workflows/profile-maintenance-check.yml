name: Profile Maintenance Checks

on:
  pull_request:
    paths:
      - README.md
      - '.github/profile-maintenance.json'
      - '.github/workflows/profile-maintenance*.yml'
      - 'scripts/profile_maintenance/**'
      - 'tests/**'
  push:
    branches: [main, codex/profile-ai-showcase]
    paths:
      - README.md
      - '.github/profile-maintenance.json'
      - '.github/workflows/profile-maintenance*.yml'
      - 'scripts/profile_maintenance/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -v
          python -m scripts.profile_maintenance.run validate
          git diff --check

  public-evidence-dry-run:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate live public evidence without calling the model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.profile_maintenance.run prepare \
            --dry-run --output-dir "$RUNNER_TEMP/profile-review"
