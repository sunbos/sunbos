name: Metrics

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions: {}

# Summary cards use the same group to avoid overlapping writes to this branch.
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate compact activity metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, metadata
          config_timezone: Asia/Shanghai
          config_twemoji: yes
          config_octicon: yes
          plugins_errors_fatal: yes
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_notable: yes
          # Keep indepth off: some repositories return non-array contribution data.
          plugin_notable_indepth: no
