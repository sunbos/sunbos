name: AI Profile Maintenance

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只采集公开证据，不调用模型、不写入仓库'
        type: boolean
        default: true
      force:
        description: '即使证据相同也重新审查（需要关闭 dry_run，会调用模型）'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: profile-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'sunbos/sunbos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test the maintenance boundaries
        run: |
          echo "REVIEW_DIR=$RUNNER_TEMP/profile-maintenance" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v
          python -m scripts.profile_maintenance.run validate
          echo "PROFILE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Collect evidence and review only changed inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REQUEST_DRY_RUN: ${{ inputs.dry_run }}
          REQUEST_FORCE: ${{ inputs.force }}
          REQUEST_REF: ${{ github.ref }}
        shell: bash
        run: |
          args=(prepare --output-dir "$REVIEW_DIR")
          if [[ "$REQUEST_DRY_RUN" == "true" || "$REQUEST_REF" != "refs/heads/main" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$REQUEST_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python -m scripts.profile_maintenance.run "${args[@]}"

      - name: Validate the candidate in this trusted workflow
        if: steps.prepare.outputs.publish == 'true'
        run: |
          cp "$REVIEW_DIR/candidate.md" README.md
          python -m unittest discover -s tests -v
          python -m scripts.profile_maintenance.run validate
          git diff --check

      - name: Publish validated text or save the no-change checkpoint
        if: steps.prepare.outputs.status == 'reviewed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.profile_maintenance.run publish \
            --output-dir "$REVIEW_DIR" --base-sha "$PROFILE_BASE_SHA"

  dependencies:
    if: github.repository == 'sunbos/sunbos' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test dependency-update boundaries
        run: python -m unittest discover -s tests -p 'test_dependencies.py' -v
      - name: Merge verified routine action updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.profile_maintenance.dependencies
