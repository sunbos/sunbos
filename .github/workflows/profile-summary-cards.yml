name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions: {}

# Metrics also writes to this branch; serialize the two publishers.
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve the latest branch tip after waiting for the concurrency lock.
          ref: ${{ github.ref_name }}

      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: github
          AUTO_PUSH: false

      # The upstream action deletes its entire output directory on every run.
      - name: Preserve light cards
        run: cp -R profile-summary-card-output/github "$RUNNER_TEMP/profile-cards-github"

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: github_dark
          AUTO_PUSH: false

      - name: Restore and validate both themes
        run: |
          cp -R "$RUNNER_TEMP/profile-cards-github" profile-summary-card-output/github
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("profile-summary-card-output")
          cards = (
              "0-profile-details.svg", "1-repos-per-language.svg",
              "2-most-commit-language.svg", "3-stats.svg", "4-productive-time.svg",
          )
          for theme in ("github", "github_dark"):
              for card in cards:
                  path = root / theme / card
                  if ET.parse(path).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                      raise SystemExit(f"Invalid SVG: {path}")
          (root / "README.md").write_text(
              "# Profile summary cards\n\n"
              "Generated daily for the two themes used by the [profile](../README.md):\n\n"
              "- [GitHub light](github/README.md)\n"
              "- [GitHub dark](github_dark/README.md)\n\n"
              "See the [maintenance guide](../.github/PROFILE.md) before changing generated files or workflows.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit changed cards
        run: |
          git add -- profile-summary-card-output
          if git diff --cached --quiet; then
            echo "Profile cards are unchanged."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: refresh profile summary cards [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
